<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - Powered by Local LLM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            background: #0f0f23;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            text-align: center;
        }
        .chat-header h1 { color: white; font-size: 24px; font-weight: 600; }
        .chat-header p { color: rgba(255,255,255,0.8); font-size: 14px; margin-top: 5px; }
        .model-info {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }
        .status { display: flex; align-items: center; gap: 6px; }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .messages { height: 400px; overflow-y: auto; padding: 20px; }
        .message { margin-bottom: 16px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { text-align: right; }
        .message-content {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 80%;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .message.assistant .message-content {
            background: rgba(102,126,234,0.2);
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .typing-indicator {
            display: flex; gap: 4px; padding: 12px 16px;
            background: rgba(102,126,234,0.2); border-radius: 16px; width: fit-content;
        }
        .typing-indicator span {
            width: 8px; height: 8px; background: rgba(255,255,255,0.5);
            border-radius: 50%; animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        .input-area {
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .input-wrapper { display: flex; gap: 12px; }
        #messageInput {
            flex: 1; padding: 14px 20px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: white; font-size: 16px; outline: none;
            transition: border-color 0.2s;
        }
        #messageInput:focus { border-color: rgba(102,126,234,0.5); }
        #messageInput::placeholder { color: rgba(255,255,255,0.4); }
        #sendBtn {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        #sendBtn:hover { transform: scale(1.05); }
        #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .error {
            background: rgba(239,68,68,0.2);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5; padding: 12px; border-radius: 8px; margin: 16px 20px; font-size: 14px;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 Local AI Chat</h1>
            <p>Powered by your own AI Server</p>
        </div>
        <div class="model-info">
            <div class="status"><span class="status-dot"></span><span>Connected to local LLM</span></div>
            <div id="modelName">Model: Loading...</div>
        </div>
        <div id="errorContainer"></div>
        <div class="messages" id="messages">
            <div class="message assistant">
                <div class="message-content">Hello! I'm your local AI assistant. How can I help you today?</div>
            </div>
        </div>
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off">
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>
    <script>
        const API_BASE = window.location.origin;
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const errorContainer = document.getElementById('errorContainer');
        const modelNameEl = document.getElementById('modelName');
        let messages = [];
        let isLoading = false;
        const API_KEY = localStorage.getItem('ai_api_key') || prompt('Enter your API Key:');
        if (API_KEY) localStorage.setItem('ai_api_key', API_KEY);
        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || isLoading) return;
            messages.push({ role: 'user', content });
            renderMessages();
            messageInput.value = '';
            isLoading = true;
            sendBtn.disabled = true;
            const typingHtml = '<div class="message assistant" id="typing"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
            messagesContainer.insertAdjacentHTML('beforeend', typingHtml);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            try {
                const response = await fetch(`${API_BASE}/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
                    body: JSON.stringify({ model: 'llama3.2:1b', messages, stream: false })
                });
                document.getElementById('typing')?.remove();
                if (!response.ok) { const error = await response.json(); throw new Error(error.error?.message || 'Request failed'); }
                const data = await response.json();
                const assistantMessage = data.choices[0]?.message?.content || 'No response received.';
                messages.push({ role: 'assistant', content: assistantMessage });
                renderMessages();
            } catch (error) {
                document.getElementById('typing')?.remove();
                showError(error.message);
            } finally { isLoading = false; sendBtn.disabled = false; messageInput.focus(); }
        }
        function renderMessages() {
            const html = messages.map(m => `<div class="message ${m.role}"><div class="message-content">${escapeHtml(m.content)}</div></div>`).join('');
            messagesContainer.innerHTML = html;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        function showError(message) { errorContainer.innerHTML = `<div class="error">⚠️ ${escapeHtml(message)}</div>`; setTimeout(() => errorContainer.innerHTML = '', 5000); }
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
        fetch(`${API_BASE}/health`, { headers: { 'Authorization': `Bearer ${API_KEY}` } }).then(r => { if (r.ok) modelNameEl.textContent = 'Model: Llama 3.2 (Q4)'; }).catch(() => { modelNameEl.textContent = 'Model: Unable to connect'; });
    </script>
</body>
</html>
