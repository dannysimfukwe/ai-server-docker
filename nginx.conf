worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Redirect server logs to stdout for container logging
    access_log /dev/stdout main;
    error_log /dev/stderr;

    sendfile on;
    keepalive_timeout 65;

    upstream ollama {
        server 127.0.0.1:11434;
        keepalive 32;
    }

    server {
        listen 8000 default_server;
        server_name _;

        client_body_buffer_size 16k;
        client_max_body_size 10m;

        # Health check endpoint (no auth required)
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # API key info endpoint (no auth required — shows the key for this deployment)
        location /api-key {
            add_header Content-Type text/plain;
            return 200 "__API_KEY__";
        }

        # API endpoint - requires valid Bearer token
        location /v1/ {
            if ($http_authorization !~ "^Bearer __API_KEY__$") {
                return 401 '{"error":{"message":"Invalid or missing API key. Include: Authorization: Bearer <your-api-key>","type":"authentication_error"}}';
            }

            add_header Content-Type application/json;

            # Set auth header for Ollama
            proxy_set_header Authorization "";

            # Proxy to Ollama
            proxy_pass http://ollama;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for streaming
            proxy_buffering off;
            proxy_cache off;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
        }

        # Static files (index.html)
        location / {
            root /app;
            index index.html;
            try_files $uri $uri/ =404;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'";
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /app;
        }
    }
}
