worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log;

    sendfile on;
    keepalive_timeout 65;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=global:10m rate=30r/m;
    limit_req_zone $api_key zone=per_key:10m rate=30r/m;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    upstream llama {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_body_buffer_size 16k;
        client_max_body_size 10m;

        # Health check endpoint (no auth required)
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # API endpoint with auth + rate limiting
        location /v1/ {
            # Rate limiting
            limit_req zone=global burst=10 nodelay;
            limit_req zone=per_key burst=5 nodelay;

            # Connection limiting
            limit_conn addr_limit 3;

            # Auth check
            access_by_lua_file /etc/nginx/auth.lua;

            # Proxy to llama.cpp
            proxy_pass http://llama;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for streaming
            proxy_buffering off;
            proxy_cache off;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;

            # For streaming responses
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Static files (index.html, demo page)
        location / {
            root /app;
            index index.html;
            try_files $uri $uri/ =404;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /app;
        }
    }
}